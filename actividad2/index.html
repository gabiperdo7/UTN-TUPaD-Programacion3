<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes Web</title>
</head>

<body>

    <header>
        <h1>Planes Web</h1>

        <nav>
            <a href="#planes">Planes</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <main>

        <section id="planes">

            <h2>Nuestros planes</h2>

            <table border="1">

                <thead>
                    <tr>
                        <th scope="col">Plan</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Páginas</th>
                        <th scope="col">Soporte</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <th scope="row">Básico</th>
                        <td>$10.000</td>
                        <td>1 página</td>
                        <td>Email</td>
                    </tr>

                    <tr>
                        <th scope="row">Profesional</th>
                        <td>$20.000</td>
                        <td>5 páginas</td>
                        <td>Email y WhatsApp</td>
                    </tr>

                    <tr>
                        <th scope="row">Premium</th>
                        <td>$35.000</td>
                        <td>10 páginas</td>
                        <td>Soporte completo</td>
                    </tr>

                </tbody>

            </table>

        </section>


        <section id="contacto">

            <h2>Contactanos</h2>

            <form action="#" method="get">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="motivo">Motivo de contacto:</label>

                <select id="motivo" name="motivo">
                    <option value="consulta">Consulta</option>
                    <option value="contratacion">Contratación</option>
                    <option value="soporte">Soporte</option>
                </select>

                <br><br>

                <fieldset>

                    <legend>Tipo de consulta</legend>

                    <input type="radio" id="personal" name="tipo" value="personal">
                    <label for="personal">Personal</label>

                    <input type="radio" id="empresa" name="tipo" value="empresa">
                    <label for="empresa">Empresa</label>

                </fieldset>

                <br>

                <label for="mensaje">Mensaje:</label>
                <br>

                <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>

                <br><br>

                <input type="checkbox" id="terminos" name="terminos">
                <label for="terminos">Acepto los términos y condiciones</label>

                <br><br>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Planes Web - Todos los derechos reservados.</p>
    </footer>

</body>

</html>
